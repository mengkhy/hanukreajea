<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Bodiatrade favicon: B letter on dark blue background with gold accent -->
  <rect width="64" height="64" rx="12" fill="#1D4A8A"/>
  <!-- Gold accent border -->
  <rect x="3" y="3" width="58" height="58" rx="10" fill="none" stroke="#F4C41B" stroke-width="2"/>
  <!-- B letter -->
  <text x="32" y="46" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#F4C41B" text-anchor="middle">B</text>
</svg>